# SegDocument config for example 08.
#
# Each field can be a plain string (in *both* reports) or a mapping
# with `name` and `reports` keys. `reports` accepts a single string
# ("test_performed", "test_results", "all") or a list of those.
#
# `test_id`, `value`, `expected`, `passed` and `operator` end up in
# both reports; `msg_id` is only in test_performed (the test plan
# view); `msg` and `detail` are only in test_results (the per-failure
# dump).

fields:
  - test_id                                    # both reports
  - value                                      # both reports
  - expected                                   # both reports
  - passed                                     # both reports
  - name: msg_id
    reports: test_performed
  - name: msg
    reports: test_results
  - name: detail
    reports: test_results
  - operator                                   # both reports

include_passed: true
include_failed: true

# The test_id update function is specified in Python: example.py
# passes `test_id_function=make_test_id` (a plain callable) to
# SegDocument, and an explicit kwarg wins over this file.
#
# Uncomment the line below to drive it from the YML instead. The
# value must be a "package.module:attr" string — the same
# convention as logging.config.dictConfig and pickle. It is
# resolved on SegDocument construction and installed globally via
# set_test_id_function, so the same id ends up in the log lines
# emitted by check_value as well.
#
# test_id_function: "examples.08_test_id_and_yaml.test_id_helpers:make_test_id"
